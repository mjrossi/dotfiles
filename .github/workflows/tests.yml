name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The two ends that matter: 3.9 is the floor the scripts promise (and
        # macOS's system python3), 3.14 the newest. The scripts are stdlib
        # only, so the versions in between mostly re-run the same code.
        python-version: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover tests -v

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install + reinstall + uninstall against scratch HOME
        run: |
          set -euxo pipefail
          SCRATCH_HOME="$(mktemp -d)"
          mkdir -p "$SCRATCH_HOME/.config"
          export HOME="$SCRATCH_HOME"
          export DOTFILES_STATE_FILE="$SCRATCH_HOME/.dotfiles-state"
          ./install.py --force --skip-brew
          ./install.py --force --skip-brew
          ./uninstall.py --force

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only needs to parse the files (fish --no-execute), so the distro's
      # fish is new enough.
      - run: sudo apt-get update && sudo apt-get install -y fish
      # just and stylua from mise, as on the desktop. The repo's own
      # mise/config.toml is the global config, not a project one, so the
      # tools are listed inline here instead.
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            "aqua:casey/just" = "latest"
            "aqua:JohnnyMorganz/StyLua" = "latest"
      - run: just lint
